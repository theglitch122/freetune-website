<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FreeTune Web</title>
<meta name="description" content="FreeTune in your browser: search and play any song from YouTube, make playlists and like songs.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="../img/icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <a class="brand" href="#home"><img src="../img/icon.png" alt="">FreeTune <span class="web">Web</span></a>
    <nav class="nav" aria-label="Main">
      <a href="#home" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
      <a href="#search" data-view="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>Search</a>
      <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Settings</a>
    </nav>
    <section class="lib" aria-label="Your Library">
      <div class="lib-head"><span>Your Library</span><button class="icon-btn" id="new-pl" title="New playlist" aria-label="New playlist"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div id="lib-list" class="lib-list"></div>
    </section>
    <a class="get-app" href="../index.html#get-freetune" target="_blank" rel="noopener">
      <b>Your Spotify library is in the app</b>
      <span>Playlists, Liked Songs, podcasts and downloads. Free for Windows, Android and iPhone.</span>
    </a>
  </aside>

  <main id="main" tabindex="-1"></main>

  <div id="video-card" aria-label="YouTube player">
    <div class="vc-head"><span>Playing from YouTube</span></div>
    <div class="vc-frame"><div id="yt"></div></div>
  </div>

  <footer id="player" aria-label="Player">
    <div class="np">
      <img id="np-art" alt="">
      <div class="np-text"><div id="np-title" class="t">Nothing playing</div><div id="np-artist" class="a">Search for a song to start</div></div>
      <button class="icon-btn like" id="np-like" aria-label="Save to Liked Songs" aria-pressed="false" hidden><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-9.2-8.6C1.4 8.5 3.2 5 6.6 5c2 0 3.4 1.1 4.4 2.5C12 6.1 13.4 5 15.4 5c3.4 0 5.2 3.5 3.8 6.4C19 15.6 12 20 12 20z"/></svg></button>
    </div>
    <div class="ctrl">
      <div class="btns">
        <button class="icon-btn toggle" id="shuffle" aria-label="Shuffle" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7h3c4 0 6 10 10 10h3M4 17h3c1.6 0 2.8-1.6 4-3.5M13 9.5C14.2 7.6 15.4 7 17 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/></svg></button>
        <button class="icon-btn" id="prev" aria-label="Previous"><svg viewBox="0 0 24 24"><path d="M6 5v14M18 6l-9 6 9 6z" class="fill"/></svg></button>
        <button class="play-btn" id="play" aria-label="Play"><svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z" class="fill"/></svg><svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" class="fill"/></svg></button>
        <button class="icon-btn" id="next" aria-label="Next"><svg viewBox="0 0 24 24"><path d="M18 5v14M6 6l9 6-9 6z" class="fill"/></svg></button>
        <button class="icon-btn toggle" id="repeat" aria-label="Repeat" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg><span class="one">1</span></button>
      </div>
      <div class="seek"><span id="t-cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="t-dur">0:00</span></div>
    </div>
    <div class="extra">
      <button class="icon-btn" id="queue-btn" aria-label="Queue" title="Queue"><svg viewBox="0 0 24 24"><path d="M4 6h12M4 11h12M4 16h7M17 14v6l4-3z"/></svg></button>
      <svg viewBox="0 0 24 24" class="vol-i" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4zM16 9a4 4 0 0 1 0 6"/></svg>
      <input id="vol" type="range" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </footer>

  <nav id="tabbar" aria-label="Main">
    <a href="#home" data-view="home"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="#search" data-view="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>Search</a>
    <a href="#library" data-view="library"><svg viewBox="0 0 24 24"><path d="M5 4v16M10 4v16M15 4l5 16"/></svg>Library</a>
    <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>Settings</a>
  </nav>
</div>

<div id="menu" role="menu" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"></dialog>

<script src="../web/yt.js"></script>
<script src="app.js"></script>
</body>
</html>
